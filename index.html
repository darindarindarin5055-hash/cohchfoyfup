<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>زیرەک | یاریدەدەری زیرەکی دەستکرد</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0e1a;
    --card: #131a2a;
    --border: rgba(99,102,241,0.15);
    --text: #e6edf3;
    --muted: #8b949e;
    --primary: #6366f1;
    --primary-2: #a855f7;
    --accent: #22d3ee;
  }
  body.light {
    --bg: #f8fafc;
    --card: #ffffff;
    --border: rgba(99,102,241,0.2);
    --text: #1e293b;
    --muted: #64748b;
  }
  html, body {
    font-family: 'Noto Kufi Arabic', sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; overflow: hidden;
    transition: background 0.3s, color 0.3s;
  }
  body:not(.light) {
    background-image:
      radial-gradient(circle at 10% 10%, rgba(99,102,241,0.15), transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(168,85,247,0.15), transparent 40%);
  }

  .app {
    display: flex; flex-direction: column;
    height: 100vh; max-width: 900px; margin: 0 auto;
    padding: 16px;
  }

  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-radius: 16px;
    background: var(--card); backdrop-filter: blur(20px);
    border: 1px solid var(--border); margin-bottom: 12px; flex-shrink: 0;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
    box-shadow: 0 4px 20px rgba(99,102,241,0.4);
  }
  .logo-text {
    font-weight: 900; font-size: 1.1rem;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .logo-status { font-size: 0.68rem; color: #22c55e; font-weight: 600; }
  .logo-status::before { content: '● '; animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: 0.4; } }

  .header-btns { display: flex; gap: 6px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 10px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    color: var(--text); cursor: pointer; font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .icon-btn:hover { background: rgba(99,102,241,0.15); border-color: var(--primary); }
  .icon-btn.active { background: rgba(99,102,241,0.25); border-color: var(--primary); }

  /* ==== تابەکان ==== */
  .tabs {
    display: flex; gap: 8px; margin-bottom: 12px; flex-shrink: 0;
  }
  .tab {
    flex: 1; padding: 10px 16px; border-radius: 12px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--muted); cursor: pointer; font-family: inherit;
    font-weight: 700; font-size: 0.85rem; transition: all 0.2s;
  }
  .tab.active {
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    color: white; border-color: transparent;
    box-shadow: 0 4px 20px rgba(99,102,241,0.3);
  }

  .view { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .view.active { display: flex; }

  /* ==== چات ==== */
  .chat {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column;
    gap: 16px; padding: 8px 4px;
  }
  .chat::-webkit-scrollbar { width: 6px; }
  .chat::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.3); border-radius: 3px; }

  .msg {
    display: flex; gap: 10px; animation: fadeIn 0.3s ease; max-width: 85%;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user { align-self: flex-start; flex-direction: row-reverse; }
  .msg.ai { align-self: flex-end; }

  .avatar {
    width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 1rem;
  }
  .msg.user .avatar { background: linear-gradient(135deg, var(--primary), var(--primary-2)); }
  .msg.ai .avatar { background: linear-gradient(135deg, var(--accent), #3b82f6); }

  .bubble {
    padding: 12px 16px; border-radius: 16px;
    line-height: 1.8; font-size: 0.95rem;
    white-space: pre-wrap; word-wrap: break-word;
    overflow-wrap: break-word; min-width: 60px;
    position: relative;
  }
  .msg.user .bubble { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: white; border-top-right-radius: 4px; }
  .msg.ai .bubble { background: var(--card); border: 1px solid var(--border); border-top-left-radius: 4px; }

  .bubble img { max-width: 100%; border-radius: 12px; margin-top: 8px; display: block; }

  .speak-btn {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 0.8rem; margin-top: 8px; padding: 4px 8px; border-radius: 6px;
    transition: all 0.2s;
  }
  .speak-btn:hover { background: rgba(99,102,241,0.15); color: var(--accent); }

  /* ==== نووسینی دەستپێک ==== */
  .welcome {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; gap: 20px; padding: 20px;
  }
  .welcome-icon { font-size: 4rem; animation: bounce 2s infinite; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .welcome h1 {
    font-size: clamp(1.5rem, 5vw, 2rem); font-weight: 900;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .welcome p { color: var(--muted); max-width: 500px; font-size: 0.9rem; }

  .suggestions {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px; width: 100%; max-width: 600px; margin-top: 10px;
  }
  .suggestion {
    background: var(--card); border: 1px solid var(--border);
    padding: 12px 14px; border-radius: 12px;
    cursor: pointer; text-align: right; font-family: inherit;
    color: var(--text); font-size: 0.82rem; transition: all 0.2s;
  }
  .suggestion:hover { border-color: var(--primary); transform: translateY(-2px); }
  .suggestion strong { display: block; color: var(--accent); margin-bottom: 4px; font-size: 0.75rem; }

  /* ==== بەشی نووسین ==== */
  .composer {
    flex-shrink: 0; margin-top: 12px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; padding: 8px;
    display: flex; gap: 6px; align-items: flex-end;
    transition: border-color 0.2s;
  }
  .composer:focus-within { border-color: var(--primary); }

  .composer textarea {
    flex: 1; background: transparent; border: none;
    color: var(--text); font-family: inherit; font-size: 0.95rem;
    padding: 10px 12px; resize: none; outline: none;
    max-height: 150px; line-height: 1.6;
  }
  .composer textarea::placeholder { color: var(--muted); }

  .mic-btn {
    width: 44px; height: 44px; border-radius: 14px;
    background: rgba(99,102,241,0.1); border: 1px solid var(--border);
    color: var(--accent); cursor: pointer; font-size: 1.2rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; flex-shrink: 0;
  }
  .mic-btn:hover { background: rgba(99,102,241,0.2); border-color: var(--primary); }
  .mic-btn.recording {
    background: #ef4444; color: white; border-color: #ef4444;
    animation: recording 1s infinite;
  }
  @keyframes recording {
    0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); }
    50% { box-shadow: 0 0 0 12px rgba(239,68,68,0); }
  }

  .send-btn {
    width: 44px; height: 44px; border-radius: 14px;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    border: none; color: white; cursor: pointer; font-size: 1.2rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; flex-shrink: 0;
  }
  .send-btn:hover:not(:disabled) { transform: scale(1.05); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ==== تایپینگ ==== */
  .typing .bubble { display: flex; gap: 4px; padding: 16px; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); animation: typing 1.4s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0%,60%,100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-8px); opacity: 1; }
  }

  /* ==== دروستکردنی وێنە ==== */
  .image-gen {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px; gap: 20px; overflow-y: auto;
  }
  .image-gen h2 {
    font-size: clamp(1.4rem, 4vw, 1.8rem); font-weight: 900;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    text-align: center;
  }
  .image-gen p { color: var(--muted); text-align: center; max-width: 500px; font-size: 0.9rem; }

  .img-input-wrap {
    width: 100%; max-width: 600px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 8px;
    display: flex; gap: 8px; align-items: center;
  }
  .img-input-wrap input {
    flex: 1; background: transparent; border: none;
    color: var(--text); font-family: inherit; font-size: 0.95rem;
    padding: 12px; outline: none;
  }
  .img-input-wrap input::placeholder { color: var(--muted); }

  .image-result {
    width: 100%; max-width: 600px;
    display: flex; flex-direction: column; align-items: center;
    gap: 12px;
  }
  .image-result img {
    width: 100%; border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow: 0 10px 40px rgba(99,102,241,0.2);
  }
  .image-loading {
    display: flex; flex-direction: column; align-items: center;
    gap: 16px; padding: 40px;
  }
  .spinner {
    width: 50px; height: 50px;
    border: 4px solid rgba(99,102,241,0.2);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ==== ئاگاداری ==== */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    padding: 12px 24px; border-radius: 12px; font-size: 0.85rem; z-index: 1000;
    opacity: 0; transition: opacity 0.3s; pointer-events: none;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3); max-width: 90vw;
  }
  .toast.show { opacity: 1; }
  .toast.error { background: #ef4444; color: white; }
  .toast.success { background: #22c55e; color: white; }
  .toast.info { background: var(--primary); color: white; }

  @media (max-width: 600px) {
    .app { padding: 8px; }
    .msg { max-width: 92%; }
    .bubble { font-size: 0.88rem; padding: 10px 14px; }
    .tab { font-size: 0.78rem; padding: 8px; }
    .icon-btn { width: 34px; height: 34px; font-size: 0.9rem; }
    .logo-icon { width: 34px; height: 34px; font-size: 1.1rem; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="logo">
      <div class="logo-icon">🤖</div>
      <div>
        <div class="logo-text">زیرەک</div>
        <div class="logo-status">ئامادەیە</div>
      </div>
    </div>
    <div class="header-btns">
      <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="گۆڕینی دۆخ">🌙</button>
      <button class="icon-btn" onclick="clearAll()" title="سڕینەوە">🗑️</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('chat')" id="tabChat">💬 گفتوگۆ</button>
    <button class="tab" onclick="switchTab('image')" id="tabImage">🎨 دروستکردنی وێنە</button>
  </div>

  <!-- ==== تابەی چات ==== -->
  <div class="view active" id="viewChat">
    <div class="chat" id="chat">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">🤖</div>
        <h1>سڵاو! من زیرەکم</h1>
        <p>بە کوردی قسە دەکەم، دەنگت دەبیستێت، و وێنەش دروست دەکەم. هەر پرسیارێکت هەیە بیکە!</p>
        <div class="suggestions">
          <button class="suggestion" onclick="sendSuggestion('ژیانی پێغەمبەر محەممەد بۆم باس بکە بە کورتی')">
            <strong>📖 زانست</strong>ژیانی پێغەمبەر بۆم باس بکە
          </button>
          <button class="suggestion" onclick="sendSuggestion('چۆن دەتوانم کوردی باشتر فێر ببم؟')">
            <strong>📚 فێرکردن</strong>چۆن کوردی فێر ببم؟
          </button>
          <button class="suggestion" onclick="sendSuggestion('وێبسایتێکی سادە بە HTML بۆم دروست بکە')">
            <strong>💻 کۆد</strong>وێبسایتێک بە HTML دروست بکە
          </button>
          <button class="suggestion" onclick="sendSuggestion('چیرۆکێکی کورت بۆ منی بگێڕەوە')">
            <strong>✨ چیرۆک</strong>چیرۆکێکی کورت بۆم بگێڕەوە
          </button>
        </div>
      </div>
    </div>

    <div class="composer">
      <textarea id="input" placeholder="نامەیەک بنووسە بە کوردی..." rows="1"
        oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
      <button class="mic-btn" id="micBtn" onclick="toggleVoice()" title="قسە بکە">🎤</button>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <!-- ==== تابەی وێنە ==== -->
  <div class="view" id="viewImage">
    <div class="image-gen">
      <h2>🎨 دروستکردنی وێنە بە AI</h2>
      <p>وەسفێک بنووسە و ئێمە وێنەیەک بۆت دروست دەکەین. بۆ نموونە: «شاخێکی بەرز بە بەفر»</p>
      <div class="img-input-wrap">
        <input type="text" id="imgInput" placeholder="وەسفی وێنەکە بنووسە..." onkeydown="if(event.key==='Enter')generateImage()">
        <button class="send-btn" onclick="generateImage()" id="imgBtn">✨</button>
      </div>
      <div class="image-result" id="imageResult"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ ڕێکخستن ============
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const welcome = document.getElementById('welcome');
const toast = document.getElementById('toast');
const micBtn = document.getElementById('micBtn');

let messages = JSON.parse(localStorage.getItem('zirak_messages') || '[]');
let isTyping = false;
let recognition = null;
let isRecording = false;
let currentTab = 'chat';

// بارکردنی دۆخ
if (localStorage.getItem('zirak_theme') === 'light') {
  document.body.classList.add('light');
  document.getElementById('themeBtn').textContent = '☀️';
}

// بارکردنی چاتی پێشوو
window.addEventListener('load', () => {
  if (messages.length > 0) {
    welcome.style.display = 'none';
    messages.forEach(m => renderMessage(m.role, m.content, false));
    showToast('چاتی پێشوو بارکرا', 'info');
  }
  input.focus();
});

// ============ سیستەم پرۆمپت ============
const SYSTEM_PROMPT = `تۆ یاریدەدەرێکی زیرەکی دەستکردیت بە ناوی "زیرەک". 
هەمیشە بە زمانی کوردی (سۆرانی) وەڵام بدەوە.
وەڵامەکانت ڕوون، سادە و بەسوود بن.
ئەگەر پرسیارێک نازانیت، بە ڕاستگۆیی بڵێ نازانیت.
زمانی کوردی بە شێوازی ڕاست و دروست بەکاربهێنە.`;

// ============ دۆخ ============
function toggleTheme() {
  document.body.classList.toggle('light');
  const isLight = document.body.classList.contains('light');
  document.getElementById('themeBtn').textContent = isLight ? '☀️' : '🌙';
  localStorage.setItem('zirak_theme', isLight ? 'light' : 'dark');
}

// ============ تابەکان ============
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (tab === 'chat') {
    document.getElementById('viewChat').classList.add('active');
    document.getElementById('tabChat').classList.add('active');
    input.focus();
  } else {
    document.getElementById('viewImage').classList.add('active');
    document.getElementById('tabImage').classList.add('active');
    document.getElementById('imgInput').focus();
  }
}

// ============ چات ============
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 150) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function sendSuggestion(text) {
  input.value = text;
  sendMessage();
}

function showToast(msg, type = 'info') {
  toast.textContent = msg;
  toast.className = `toast show ${type}`;
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function renderMessage(role, text, save = true) {
  const msg = document.createElement('div');
  msg.className = `msg ${role}`;
  const icon = role === 'user' ? '👤' : '🤖';
  msg.innerHTML = `<div class="avatar">${icon}</div><div class="bubble"></div>`;
  const bubble = msg.querySelector('.bubble');
  bubble.textContent = text;

  if (role === 'ai' && 'speechSynthesis' in window) {
    const speakBtn = document.createElement('button');
    speakBtn.className = 'speak-btn';
    speakBtn.textContent = '🔊 بیخوێنەوە';
    speakBtn.onclick = () => speakText(text);
    bubble.appendChild(speakBtn);
  }

  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function addMessage(role, text) {
  renderMessage(role, text);
  messages.push({ role, content: text });
  localStorage.setItem('zirak_messages', JSON.stringify(messages));
}

function addTyping() {
  const msg = document.createElement('div');
  msg.className = 'msg ai typing';
  msg.id = 'typingMsg';
  msg.innerHTML = `<div class="avatar">🤖</div><div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typingMsg');
  if (t) t.remove();
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text || isTyping) return;

  if (welcome && welcome.parentNode) welcome.style.display = 'none';

  addMessage('user', text);
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;
  isTyping = true;
  addTyping();

  try {
    const reply = await getAIResponse(text);
    removeTyping();
    addMessage('ai', reply);
  } catch (error) {
    removeTyping();
    addMessage('ai', '😔 ببوورە، کێشەیەک ڕوویدا. تکایە دووبارە هەوڵ بدەوە.');
    console.error(error);
  } finally {
    isTyping = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

async function getAIResponse(userMessage) {
  let history = '';
  const recent = messages.slice(-6);
  recent.forEach(m => {
    history += `${m.role === 'user' ? 'بەکارهێنەر' : 'زیرەک'}: ${m.content}\n`;
  });
  const fullPrompt = `${SYSTEM_PROMPT}\n\n${history}بەکارهێنەر: ${userMessage}\nزیرەک:`;
  const encoded = encodeURIComponent(fullPrompt);
  const res = await fetch(`https://text.pollinations.ai/${encoded}?model=openai&seed=${Math.floor(Math.random()*1000000)}`);
  if (!res.ok) throw new Error('API error');
  const text = (await res.text()).trim();
  if (!text) throw new Error('Empty');
  return text;
}

// ============ دەنگ (قسەکردن) ============
function toggleVoice() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    showToast('براوزەرەکەت پشتگیری ناسینەوەی دەنگ ناکات', 'error');
    return;
  }

  if (isRecording) {
    recognition.stop();
    return;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = 'ckb-IQ'; // کوردی سۆرانی
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    isRecording = true;
    micBtn.classList.add('recording');
    micBtn.textContent = '⏹️';
    showToast('?
